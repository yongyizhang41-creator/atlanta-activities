name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://atlanta:atlanta@127.0.0.1:55432/atlanta_test
      TEST_DATABASE_URL: postgresql+psycopg://atlanta:atlanta@127.0.0.1:55432/atlanta_test
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: {POSTGRES_USER: atlanta, POSTGRES_PASSWORD: atlanta, POSTGRES_DB: atlanta_test}
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U atlanta" --health-interval 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r apps/api/requirements.lock
      - run: make migrate
      - run: npm ci
        working-directory: apps/web
      - run: make check
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser journeys
        run: |
          make api > /tmp/atlanta-api.log 2>&1 &
          make web > /tmp/atlanta-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/login > /dev/null; then break; fi
            sleep 1
          done
          make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: apps/web/test-results
